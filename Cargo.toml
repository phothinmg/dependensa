[package]
name = "dependensa"
version = "0.3.0"
edition = "2024"
description = "A static analysis tool designed to examine TypeScript and JavaScript projects and produce dependency graphs."
license = "Apache-2.0"
repository = "https://github.com/phothinmg/dependensa"
readme = "README.md"


[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
oxc = { version = "0.144.0", features = ["serialize", "ast_visit"] }
indexmap = { version = "2", features = ["serde"] }
napi = "3"
napi-derive = "3"

[dev-dependencies]
tempfile = "3"
criterion = "0.5"

[build-dependencies]
napi-build = "2"

[lib]
name = "dependensa"
path = "src/lib.rs"
# `cdylib` is required for napi-rs to produce a `.node` file.
# When building a normal Rust library (without the `napi` feature),
# `rlib` is still emitted so `cargo test` / benches keep working.
crate-type = ["cdylib", "rlib"]

[[bench]]
name = "generate_graph"
harness = false

[[bench]]
name = "parse_specifiers"
harness = false

[[bench]]
name = "topo_sort"
harness = false

[[bench]]
name = "analyze"
harness = false
